name: my_flashcard_app
description: "Flashcard học từ vựng tiếng Anh và tiếng Nhật với kho từ có sẵn."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/
    - assets/vocab/decks/en/
    - assets/vocab/decks/ja/
    - assets/vocab/decks/ko/
